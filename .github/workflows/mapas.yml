# Genera cada mes los paquetes de mapas sin conexión de PreppBase, uno por
# comunidad autónoma, y los publica como una versión (release) de este
# repositorio. La aplicación lee releases/latest/download/indice.json.
name: Mapas

on:
  schedule:
    - cron: "17 2 3 * *"   # día 3 de cada mes
  workflow_dispatch:
    inputs:
      zonas:
        description: "Zonas separadas por comas (vacío = todas)"
        required: false
        default: ""

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  preparar:
    runs-on: ubuntu-latest
    outputs:
      zonas: ${{ steps.zonas.outputs.zonas }}
    steps:
      - uses: actions/checkout@v4
      - id: zonas
        name: Lista de zonas
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          todas = [z["id"] for z in json.load(open("zonas.json"))]
          pedidas = [z.strip() for z in os.environ["PEDIDAS"].split(",") if z.strip()]
          desconocidas = set(pedidas) - set(todas)
          if desconocidas:
              raise SystemExit(f"Zonas desconocidas: {desconocidas}")
          print("zonas=" + json.dumps(pedidas or todas))
          PY
        env:
          PEDIDAS: ${{ inputs.zonas }}
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "25" }
      - name: Descargar Planetiler y las fuentes comunes (mar, Natural Earth)
        run: |
          mkdir -p data/sources
          gh release download -R onthegomap/planetiler --pattern planetiler.jar
          curl -fsSL --retry 6 --retry-all-errors --retry-delay 60 \
            -o data/sources/la-rioja.osm.pbf \
            https://download.geofabrik.de/europe/spain/la-rioja-latest.osm.pbf
          java -jar planetiler.jar --osm-path=data/sources/la-rioja.osm.pbf \
            --download --only-download
          rm data/sources/la-rioja.osm.pbf
          ls -la data/sources
      - uses: actions/cache/save@v4
        with:
          path: |
            planetiler.jar
            data/sources
          key: fuentes-${{ github.run_id }}

  zona:
    needs: preparar
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        zona: ${{ fromJson(needs.preparar.outputs.zonas) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: |
            planetiler.jar
            data/sources
          key: fuentes-${{ github.run_id }}
          fail-on-cache-miss: true
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "25" }
      - name: Instalar osmium
        run: sudo apt-get update -q && sudo apt-get install -y -q osmium-tool
      - name: Descargar OpenStreetMap (Geofabrik)
        run: |
          RUTA=$(python3 -c "import json; print(next(z.get('geofabrik', 'europe/spain/' + z['id']) for z in json.load(open('zonas.json')) if z['id'] == '${{ matrix.zona }}'))")
          # Reintentos: Geofabrik corta si se le piden muchas descargas.
          curl -fsSL --retry 4 --retry-all-errors --retry-delay 60 \
            -o zona.osm.pbf https://download.geofabrik.de/$RUTA-latest.osm.pbf ||
          # Segunda fuente si Geofabrik no responde (extractos de OSM France).
          curl -fsSL --retry 4 --retry-all-errors --retry-delay 60 \
            -o zona.osm.pbf https://download.openstreetmap.fr/extracts/$RUTA-latest.osm.pbf
          FECHA=$(osmium fileinfo -g header.option.osmosis_replication_timestamp zona.osm.pbf | cut -c1-10)
          test -n "$FECHA"
          echo "FECHA=$FECHA" >> "$GITHUB_ENV"
      - name: Mapa (PMTiles, esquema OpenMapTiles)
        run: |
          mkdir -p salida
          java -Xmx10g -jar planetiler.jar --osm-path=zona.osm.pbf \
            --output=salida/${{ matrix.zona }}.pmtiles --download --force
      - name: Puntos de interés
        run: |
          osmium tags-filter zona.osm.pbf \
            nwr/amenity=shelter,drinking_water,water_point,fuel,pharmacy,hospital,clinic,doctors \
            nwr/tourism=alpine_hut,wilderness_hut \
            nwr/natural=spring nwr/man_made=water_tap,water_well \
            nwr/healthcare=hospital,clinic,centre,pharmacy \
            -o puntos.osm.pbf
          osmium export puntos.osm.pbf -f geojsonseq -a type,id \
            --geometry-types=point,polygon -o puntos.geojsonseq
          python3 scripts/pois.py puntos.geojsonseq \
            salida/${{ matrix.zona }}-puntos.json.gz "$FECHA"
          ls -la salida
      - name: Lugares con nombre para el buscador
        run: |
          osmium tags-filter zona.osm.pbf \
            n/place=city,town,village,hamlet,isolated_dwelling,suburb,quarter,neighbourhood,locality \
            n/natural=peak,saddle n/mountain_pass=yes \
            -o lugares.osm.pbf
          osmium export lugares.osm.pbf -f geojsonseq \
            --geometry-types=point -o lugares.geojsonseq
          python3 scripts/lugares.py lugares.geojsonseq \
            salida/${{ matrix.zona }}-lugares.json.gz "$FECHA"
          ls -la salida
      - uses: actions/upload-artifact@v4
        with:
          name: zona-${{ matrix.zona }}
          path: salida/
          retention-days: 3
          compression-level: 0

  rutas:
    # Rutas de toda España en una sola construcción, repartidas por zona
    # (sección 50): así las rutas pueden pasar de una comunidad a otra.
    # Canarias va aparte (no está en el extracto de España y no tiene
    # carreteras que la unan con la península).
    needs: preparar
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Liberar espacio en disco
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /usr/local/share/boost /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Descargar OpenStreetMap de España y Canarias, y los contornos
        run: |
          mkdir -p valhalla/espana valhalla/canarias poly
          bajar() {
            curl -fsSL --retry 4 --retry-all-errors --retry-delay 60 -o "$2" \
              "https://download.geofabrik.de/$1" ||
            curl -fsSL --retry 4 --retry-all-errors --retry-delay 60 -o "$2" \
              "https://download.openstreetmap.fr/extracts/$1"
          }
          bajar europe/spain-latest.osm.pbf valhalla/espana/zona.osm.pbf
          bajar africa/canary-islands-latest.osm.pbf valhalla/canarias/zona.osm.pbf
          for z in $(python3 -c "import json; print(' '.join(z['id'] for z in json.load(open('zonas.json'))))"); do
            r=$(python3 -c "import json; print(next(z.get('geofabrik', 'europe/spain/' + z['id']) for z in json.load(open('zonas.json')) if z['id'] == '$z'))")
            curl -fsSL --retry 6 --retry-all-errors --retry-delay 30 -o poly/$z.poly \
              "https://download.geofabrik.de/$r.poly"
          done
          ls -la valhalla/*/ poly | head -40
      - name: Teselas de Valhalla 3.9.2 (la versión que lleva la aplicación)
        run: |
          for parte in espana canarias; do
            docker run --rm -v "$PWD/valhalla/$parte:/data" ghcr.io/valhalla/valhalla:3.9.2 bash -c '
              set -e
              valhalla_build_config --mjolnir-tile-dir /data/tiles \
                --mjolnir-admin /data/admin.sqlite > /data/valhalla.json
              valhalla_build_admins -c /data/valhalla.json /data/zona.osm.pbf
              valhalla_build_tiles -c /data/valhalla.json /data/zona.osm.pbf'
            sudo chown -R "$USER" valhalla/$parte
            rm valhalla/$parte/zona.osm.pbf
            du -sh valhalla/$parte/tiles
          done
      - name: Repartir por zona
        run: |
          mkdir -p salida
          for z in $(python3 -c "import json; print(' '.join(z['id'] for z in json.load(open('zonas.json'))))"); do
            parte=espana; [ "$z" = canarias ] && parte=canarias
            python3 scripts/repartir_rutas.py valhalla/$parte/tiles poly/$z.poly \
              salida/$z-rutas.tar.gz
          done
          ls -la salida
      - uses: actions/upload-artifact@v4
        with:
          name: rutas
          path: salida/
          retention-days: 3
          compression-level: 0

  publicar:
    needs: [zona, rutas]
    # Sin rutas nuevas no se publica: no se mezclan teselas de construcciones
    # distintas, que no encajarían entre sí.
    if: ${{ !cancelled() && needs.rutas.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: salida
          merge-multiple: true
      - name: Zonas que han fallado se mantienen de la versión anterior
        run: |
          for z in $(python3 -c "import json; print(' '.join(z['id'] for z in json.load(open('zonas.json'))))"); do
            if [ ! -f "salida/$z.pmtiles" ]; then
              echo "Sin datos nuevos de $z: se conserva la versión anterior"
              gh release download --pattern "$z.pmtiles" --pattern "$z-puntos.json.gz" --pattern "$z-lugares.json.gz" -D salida || true
            fi
          done
      - name: Fuentes tipográficas para los nombres del mapa
        run: |
          git clone -q --depth 1 --filter=blob:none --sparse \
            https://github.com/protomaps/basemaps-assets.git assets
          cd assets
          git sparse-checkout set "fonts/Noto Sans Regular" "fonts/Noto Sans Medium"
          # Sin espacios en los nombres: la aplicación los lee como archivos.
          mkdir fuentes
          cp -r "fonts/Noto Sans Regular" fuentes/NotoSansRegular
          cp -r "fonts/Noto Sans Medium" fuentes/NotoSansMedium
          cd fuentes && zip -q -r ../../salida/fuentes.zip NotoSansRegular NotoSansMedium
          ls -la ../../salida
      - name: Índice y publicación
        run: |
          ETIQUETA="mapas-$(date -u +%Y-%m-%d)-${{ github.run_number }}"
          python3 scripts/indice.py salida "$ETIQUETA"
          cat salida/indice.json
          gh release create "$ETIQUETA" salida/* --latest \
            --title "Mapas $(date -u +%d/%m/%Y)" \
            --notes "Paquetes de mapas sin conexión de PreppBase. Datos © colaboradores de OpenStreetMap (ODbL)."
      - name: Borrar versiones antiguas (se conservan las 2 últimas)
        run: |
          gh release list --limit 100 --json tagName,createdAt \
            -q 'sort_by(.createdAt) | reverse | .[2:] | .[].tagName' |
          while read -r t; do gh release delete "$t" --yes --cleanup-tag; done
